{% extends 'base.html' %}
{% block title %}Change Password{% endblock %}

{% block content %}
  <div class="card" style="max-width: 620px; margin: 32px auto;">
    <h2>Change password</h2>
    <p class="text-muted">Changing your password signs out all active sessions for this account.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>
        Current password
        <input type="password" name="current_password" autocomplete="current-password" required>
      </label>
      <label>
        New password
        <input type="password" name="new_password" minlength="12" autocomplete="new-password" required>
      </label>
      <label>
        Confirm new password
        <input type="password" name="confirm_password" minlength="12" autocomplete="new-password" required>
      </label>
      <button class="button" type="submit">Update password</button>
    </form>
  </div>
{% endblock %}
