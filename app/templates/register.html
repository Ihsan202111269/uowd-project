{% extends 'base.html' %}
{% block title %}Register{% endblock %}

{% block content %}
  <div class="card" style="max-width: 620px; margin: 32px auto;">
    <h2>Create account</h2>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>
        Username
        <input type="text" name="username" placeholder="alice" required>
      </label>
      <label>
        Email
        <input type="email" name="email" placeholder="alice@example.com" required>
      </label>
      <label>
        Password
        <input type="password" name="password" placeholder="At least 12 characters" minlength="12" required>
      </label>
      <button class="button" type="submit">Create account</button>
    </form>
  </div>
{% endblock %}
